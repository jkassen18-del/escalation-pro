services:
  - type: web
    name: escalation-pro
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: escalation-pro-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      # Render terminates TLS in front of the app, so secure cookies are correct.
      - key: SESSION_COOKIE_SECURE
        value: 'true'
      # Set these once in the Render dashboard to create the first administrator,
      # or leave them blank and use the setup screen on first visit.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: escalation-pro-db
    plan: starter
    postgresMajorVersion: '16'
