# InfraTicket behind Apache httpd.
#
# Apache cannot run this application; it is a Node process. Apache's job here
# is to terminate TLS, be the only thing on ports 80 and 443, and hand
# everything else to Node on localhost.
#
#   a2enmod proxy proxy_http headers ssl rewrite remoteip
#   a2ensite infraticket
#   apachectl configtest && systemctl reload apache2
#
# On RHEL/Rocky the modules are already built in; drop this in
# /etc/httpd/conf.d/ instead and reload httpd.

<VirtualHost *:80>
    ServerName tickets.example.internal

    # Everything is authenticated with a session cookie, so nothing should
    # travel in the clear. The ACME path is the one exception.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://%{SERVER_NAME}/$1 [R=308,L]

    DocumentRoot /var/www/html
</VirtualHost>

<VirtualHost *:443>
    ServerName tickets.example.internal

    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/tickets.example.internal.crt
    SSLCertificateKeyFile   /etc/ssl/private/tickets.example.internal.key
    # Internal CA? Add the chain so browsers stop warning:
    # SSLCertificateChainFile /etc/ssl/certs/internal-ca.crt

    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # The app sets its own cookie flags and headers; these are the ones only
    # the TLS terminator can honestly assert.
    Header always set Strict-Transport-Security "max-age=31536000"

    ProxyPreserveHost On
    ProxyRequests Off

    # Node is bound to loopback (see HOST in the unit file), so the only way
    # in is through here.
    ProxyPass        / http://127.0.0.1:3000/ timeout=120 retry=0
    ProxyPassReverse / http://127.0.0.1:3000/

    # The app calls app.set('trust proxy', 1) and reads these: without them
    # every audit entry records Apache's own address instead of the person's,
    # and the session cookie is issued without Secure because the app believes
    # the request arrived over plain HTTP.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # Attachments. Raise both if you raise MAX_UPLOAD_MB in the app; the
    # smallest limit in the chain is the one that applies.
    LimitRequestBody 26214400
    ProxyIOBufferSize 65536

    ErrorLog  ${APACHE_LOG_DIR}/infraticket-error.log
    CustomLog ${APACHE_LOG_DIR}/infraticket-access.log combined
</VirtualHost>
