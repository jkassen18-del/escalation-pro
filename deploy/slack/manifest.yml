# Slack app manifest.
#
# Slack API → Your apps → Create New App → From an app manifest, then paste
# this. Replace tickets.example.internal throughout.
#
# One command is declared, not one per department. Slack commands are fixed
# in the app config and cannot be wildcarded, so `/gml-finance` would mean
# editing this file and reinstalling the app every time somebody adds a
# department. `/gml finance` takes the department as an argument instead, and
# a department added in the admin UI works immediately.
display_information:
  name: Service Desk
  description: Raise and answer tickets without leaving Slack
  background_color: "#1f2937"

features:
  bot_user:
    display_name: Service Desk
    always_online: true
  slash_commands:
    - command: /gml
      url: https://tickets.example.internal/api/webhooks/slack/commands
      description: Raise a ticket
      usage_hint: "[department]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      # Posting notifications and confirmations.
      - chat:write
      # Posting into a channel the app has not been invited to.
      - chat:write.public
      # The slash command itself.
      - commands
      # Reading thread replies so they can become ticket comments.
      - channels:history
      - groups:history
      # Matching a Slack account to a user here, which is how a click or a
      # command is authorised at all.
      - users:read
      - users:read.email

settings:
  event_subscriptions:
    request_url: https://tickets.example.internal/api/webhooks/slack
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    # Buttons on ticket messages, and the ticket form.
    request_url: https://tickets.example.internal/api/webhooks/slack/interactive
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
