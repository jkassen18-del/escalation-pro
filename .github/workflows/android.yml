name: Android APK

# Wraps the deployed site in an Android WebView app and builds an installable
# (debug-signed) APK. Download it from the run's artifacts.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Site the app opens'
        default: 'https://escalation-pro.vercel.app'
  push:
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build APK
        working-directory: android
        env:
          APP_URL: ${{ inputs.app_url || 'https://escalation-pro.vercel.app' }}
        run: gradle assembleDebug -PappUrl="$APP_URL"
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk InfraTicket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InfraTicket-android
          path: InfraTicket.apk
