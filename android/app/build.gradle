plugins {
    id 'com.android.application'
}

android {
    namespace 'com.infraticket.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.infraticket.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '2.0.0'
        buildConfigField 'String', 'APP_URL', "\"${project.property('appUrl')}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
