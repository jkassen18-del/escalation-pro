# Ways to run this stack:
#
#   docker compose up -d                     app + PostgreSQL
#   docker compose up -d app                 app alone, on embedded SQLite
#   docker compose --profile tunnel up -d    the above, published on your
#                                            Cloudflare domain via a tunnel
#
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      # Comment this line out to run on the embedded SQLite database instead.
      DATABASE_URL: postgresql://${POSTGRES_USER:-escalation}:${POSTGRES_PASSWORD:-escalation}@postgres:5432/${POSTGRES_DB:-escalation_pro}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SECRET_KEY: ${SECRET_KEY:-}
      APP_URL: ${APP_URL:-}
      # Creates the first administrator on a fresh database. Ignored afterwards.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Escalation Pro}
      # Required to claim the first admin account. Set this before exposing the
      # app publicly, or the first stranger to find the URL becomes the admin.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # The tunnel terminates TLS, so secure cookies are correct behind it.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-escalation_pro}
      POSTGRES_USER: ${POSTGRES_USER:-escalation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escalation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-escalation} -d ${POSTGRES_DB:-escalation_pro}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Publishes the app on your own Cloudflare domain without opening a port or
  # touching DNS by hand. Create a tunnel in the Cloudflare Zero Trust dashboard
  # (Networks -> Tunnels), point its public hostname at http://app:3000, then
  # put the tunnel token in CLOUDFLARE_TUNNEL_TOKEN and start with
  # `docker compose --profile tunnel up -d`.
  #
  # Requires no rewrite: the tunnel simply proxies to the Node server.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ['tunnel']
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN to use the tunnel profile}
    depends_on:
      - app

volumes:
  app_data:
  postgres_data:
