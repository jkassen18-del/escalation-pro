# Two ways to run this stack:
#
#   docker compose up -d                     app + PostgreSQL
#   docker compose up -d app                 app alone, on embedded SQLite
#
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      # Comment this line out to run on the embedded SQLite database instead.
      DATABASE_URL: postgresql://${POSTGRES_USER:-escalation}:${POSTGRES_PASSWORD:-escalation}@postgres:5432/${POSTGRES_DB:-escalation_pro}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SECRET_KEY: ${SECRET_KEY:-}
      APP_URL: ${APP_URL:-}
      # Creates the first administrator on a fresh database. Ignored afterwards.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Escalation Pro}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-escalation_pro}
      POSTGRES_USER: ${POSTGRES_USER:-escalation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escalation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-escalation} -d ${POSTGRES_DB:-escalation_pro}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_data:
  postgres_data:
